<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1333" width="1000" height="1333">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="40%" stop-color="#090a10"/>
      <stop offset="70%" stop-color="#0e0f18"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <radialGradient id="crimsonAura" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ff2a3a" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ff2a3a" stop-opacity="0.12"/>
      <stop offset="75%" stop-color="#800a14" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="headRimGlow" cx="50%" cy="32%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="35%" stop-color="#ff2a3a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyberGridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3a" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff2a3a" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242838"/>
      <stop offset="30%" stop-color="#181a24"/>
      <stop offset="70%" stop-color="#0f1118"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>

    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1e2a"/>
      <stop offset="45%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <linearGradient id="laserEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a3a" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ff2a3a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#ff2a3a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff2a3a" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1000" height="1333" fill="url(#bgGrad)"/>
  <rect width="1000" height="1333" fill="url(#dotGrid)"/>

  <!-- ARCHITECTURAL PERSPECTIVE GRIDS -->
  <g stroke="url(#cyberGridGrad)" stroke-width="1" opacity="0.65">
    <line x1="500" y1="0" x2="500" y2="1333" stroke-dasharray="6,6"/>
    <line x1="0" y1="460" x2="1000" y2="460" stroke-dasharray="4,8"/>
    <line x1="0" y1="880" x2="1000" y2="880" stroke-dasharray="4,8"/>
    
    <!-- Horizon convergence lines -->
    <line x1="500" y1="460" x2="0" y2="120" stroke-opacity="0.4"/>
    <line x1="500" y1="460" x2="1000" y2="120" stroke-opacity="0.4"/>
    <line x1="500" y1="460" x2="0" y2="1250" stroke-opacity="0.5"/>
    <line x1="500" y1="460" x2="1000" y2="1250" stroke-opacity="0.5"/>
  </g>

  <!-- AMBIENT GLOWS -->
  <circle cx="500" cy="480" r="420" fill="url(#crimsonAura)"/>
  <circle cx="500" cy="400" r="280" fill="url(#headRimGlow)"/>

  <!-- FOUNDER BUST / SILHOUETTE (SAHIL BHATIA) -->
  <g id="founderSilhouette">
    <!-- Outer Rim Accent Highlight for Depth Separation -->
    <path d="M 500 230 
             C 440 230 405 270 395 330 
             C 388 380 400 450 425 500 
             C 438 528 452 548 465 565
             C 390 595 295 640 215 720
             C 160 775 110 850 75 955
             C 50 1030 35 1130 30 1333
             L 970 1333
             C 965 1130 950 1030 925 955
             C 890 850 840 775 785 720
             C 705 640 610 595 535 565
             C 548 548 562 528 575 500
             C 600 450 612 380 605 330
             C 595 270 560 230 500 230 Z" 
          fill="#ff2a3a" opacity="0.22" filter="url(#softGlow)"/>

    <!-- Main Torso & Coat Structure -->
    <path d="M 500 570
             C 435 595 340 640 255 720
             C 195 775 140 855 105 960
             C 75 1040 60 1145 50 1333
             L 950 1333
             C 940 1145 925 1040 895 960
             C 860 855 805 775 745 720
             C 660 640 565 595 500 570 Z"
          fill="url(#coatGrad)"/>

    <!-- Shoulders & Coat Lapels Detail -->
    <path d="M 500 680 L 410 880 L 425 1333 L 575 1333 L 590 880 Z" fill="#090a10" opacity="0.85"/>
    <path d="M 500 680 L 440 920 L 485 1333 L 515 1333 L 560 920 Z" fill="#0d0f16"/>

    <!-- Crisp Lapel Edge Strokes -->
    <path d="M 435 600 L 410 880 L 440 960" stroke="#ff2a3a" stroke-width="2" stroke-opacity="0.4" fill="none"/>
    <path d="M 565 600 L 590 880 L 560 960" stroke="#ff2a3a" stroke-width="2" stroke-opacity="0.4" fill="none"/>
    
    <!-- Inner Shirt / Tech Turtle Neck -->
    <path d="M 465 540 C 475 530 525 530 535 540 L 530 690 L 470 690 Z" fill="#151720"/>

    <!-- Neck & Jaw -->
    <path d="M 460 480 C 460 540 472 565 500 565 C 528 565 540 540 540 480 Z" fill="#1c202d"/>
    
    <!-- Head Base (Sculpted Silhouette with modern jawline) -->
    <path d="M 500 240 
             C 445 240 415 275 408 335 
             C 402 385 412 435 435 480 
             C 450 512 472 535 500 535 
             C 528 535 550 512 565 480 
             C 588 435 598 385 592 335 
             C 585 275 555 240 500 240 Z" 
          fill="url(#silhouetteGrad)"/>

    <!-- Structured Hair Outline (Modern, clean taper) -->
    <path d="M 495 220
             C 430 220 398 260 395 315
             C 392 340 398 360 405 375
             C 412 360 425 345 440 338
             C 460 330 540 330 560 338
             C 575 345 588 360 595 375
             C 602 360 608 340 605 315
             C 602 260 570 220 505 220 Z"
          fill="#10121a"/>

    <!-- Hair Volume Highlights -->
    <path d="M 440 245 C 475 230 525 230 560 245 C 530 238 470 238 440 245 Z" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M 420 280 C 455 260 545 260 580 280 C 545 270 455 270 420 280 Z" fill="#ff2a3a" fill-opacity="0.18"/>

    <!-- Sculptural Facial Plane Reflections (Minimalist, Cinematic Duotone) -->
    <!-- Brow & Temples -->
    <path d="M 442 355 C 465 348 488 352 500 355 C 512 352 535 348 558 355" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Nose Bridge Line -->
    <path d="M 500 355 L 498 420 L 508 432 L 492 432" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Clean Cheekbone Planes -->
    <path d="M 425 410 C 445 435 465 445 485 450" stroke="#ff2a3a" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 575 410 C 555 435 535 445 515 450" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Jawline Definition -->
    <path d="M 432 460 C 452 498 478 522 500 525 C 522 522 548 498 568 460" stroke="#ff2a3a" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Subtle Lip Line -->
    <line x1="482" y1="465" x2="518" y2="465" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- CYBERNETIC HUD & BIOMETRIC SYSTEM OVERLAYS -->
  <g id="hudOverlays" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace">
    <!-- Targeting Crosshair / Biometric Scanner at Eye Level -->
    <circle cx="500" cy="375" r="95" stroke="#ff2a3a" stroke-width="1.2" stroke-dasharray="5,15" fill="none" opacity="0.45"/>
    <circle cx="500" cy="375" r="4" fill="#ff2a3a" opacity="0.8"/>
    <line x1="380" y1="375" x2="440" y2="375" stroke="#ff2a3a" stroke-width="1" opacity="0.5"/>
    <line x1="560" y1="375" x2="620" y2="375" stroke="#ff2a3a" stroke-width="1" opacity="0.5"/>
    <line x1="500" y1="260" x2="500" y2="320" stroke="#ff2a3a" stroke-width="1" opacity="0.5"/>
    
    <!-- Laser Scan Horizon Line -->
    <rect x="100" y="374" width="800" height="2" fill="url(#laserEdge)"/>

    <!-- Founder Identification Tag in HUD -->
    <g transform="translate(120, 180)" opacity="0.85">
      <rect x="0" y="0" width="180" height="42" rx="4" fill="#0d0e15" stroke="#ff2a3a" stroke-width="1" stroke-opacity="0.5"/>
      <text x="14" y="18" fill="#ff2a3a" font-size="10" font-weight="700" letter-spacing="2">FOUNDER // SB</text>
      <text x="14" y="32" fill="#d0d4e0" font-size="9" letter-spacing="1">PORTFOLIO OS // V2.6</text>
    </g>

    <g transform="translate(700, 180)" opacity="0.85">
      <rect x="0" y="0" width="180" height="42" rx="4" fill="#0d0e15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
      <text x="14" y="18" fill="#00ffaa" font-size="10" font-weight="700" letter-spacing="2">&bull; STATUS: ACTIVE</text>
      <text x="14" y="32" fill="#8890a5" font-size="9" letter-spacing="1">LATENCY: 12ms // VERIFIED</text>
    </g>

    <!-- Chest Hologram Core (SB Monogram) -->
    <g transform="translate(500, 810)">
      <circle cx="0" cy="0" r="54" fill="#08090e" stroke="#ff2a3a" stroke-width="2" stroke-opacity="0.75" filter="url(#softGlow)"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,6" stroke-opacity="0.3"/>
      <text x="0" y="11" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="4" text-anchor="middle">SB</text>
      <text x="0" y="30" fill="#ff2a3a" font-size="8" font-weight="700" letter-spacing="3" text-anchor="middle">SYSTEMS ARCHITECT</text>
    </g>

    <!-- Bottom Vignette & Typographic Anchors -->
    <rect x="0" y="1100" width="1000" height="233" fill="url(#bgGrad)" opacity="0.95"/>
    <line x1="120" y1="1160" x2="880" y2="1160" stroke="#ff2a3a" stroke-width="1.5" stroke-opacity="0.4"/>

    <text x="500" y="1210" fill="#ffffff" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="6" text-anchor="middle">SAHIL BHATIA</text>
    <text x="500" y="1245" fill="#a0a8bf" font-size="14" font-weight="600" letter-spacing="4" text-anchor="middle">AI-NATIVE BUILDER &bull; SYSTEMS ARCHITECT</text>
    <text x="500" y="1275" fill="#ff2a3a" font-size="11" font-weight="700" letter-spacing="3" text-anchor="middle">ENGINEERING DIGITAL OPERATING LEVERAGE</text>
  </g>
</svg>
